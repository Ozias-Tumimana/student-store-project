# ── Render Blueprint for Student Store ──
# Two services: the Express API (Web Service) and the React/Vite storefront
# (Static Site). Deploy via Render → "New +" → "Blueprint" → point at this repo.
# Docs: https://render.com/docs/blueprint-spec
#
# The database is EXTERNAL (Neon) — not provisioned here — so it never expires
# (unlike Render's free Postgres, which is deleted ~30 days after creation).
# This mirrors how the Orbis capstone is set up. See DEPLOY.md for the Neon steps.
#
# After the first deploy, fill these in the dashboard:
#   • DATABASE_URL  (backend)   — the Neon connection string (see DEPLOY.md)
#   • VITE_API_URL  (storefront) — the API service URL, then redeploy the UI
# (Render can't inject a Web Service URL into a Static Site's build, so it's manual.)

services:
  # ── Express API ──
  - type: web
    name: student-store-api
    runtime: node
    plan: free
    rootDir: student-store-api
    # Install, generate the Prisma client, apply migrations, then seed products.
    # (Seed TRUNCATEs and reloads on every deploy — fine for a demo store, but it
    #  resets any orders placed through the live site. Drop `&& npm run seed`
    #  after the first deploy if you want orders to persist.)
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false          # paste the Neon connection string in the dashboard

  # ── React storefront (static) ──
  - type: web
    name: student-store-ui
    runtime: static
    rootDir: student-store-ui
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # SPA fallback so react-router deep links / reloads work.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # set to the student-store-api URL after first deploy
